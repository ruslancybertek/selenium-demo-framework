name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: mvn -B test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testng-reports
          path: target/surefire-reports/
          retention-days: 7
